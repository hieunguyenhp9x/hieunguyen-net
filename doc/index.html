<script>
/* 16/10: GHI LỖI THẬT — Clarity chỉ thấy "Script error." (lỗi trong thư viện tải từ cdnjs/jsdelivr bị trình duyệt
   giấu chi tiết), 2–3% lượt /doc. Thêm crossorigin cho 2 thư viện để lộ câu lỗi + bắn GA4 `loi_js`
   (form_location = "loi_doc:<câu lỗi>", file_name = file:dòng) -> ga4_phieu.py / soi_tuan.py in dòng 🔴. Tối đa 3 lỗi/lượt. */
(function(){ var n = 0;
  function ghi(msg, cho){ if (n++ >= 3) return; try { if (window.gtag) gtag('event', 'loi_js', { form_location: ('loi_doc:' + msg).slice(0, 95), file_name: String(cho || '').slice(0, 95) }); } catch(x){} }
  window.addEventListener('error', function(e){ ghi(e.message || '?', (e.filename || '').split('/').pop() + ':' + (e.lineno || 0)); });
  window.addEventListener('unhandledrejection', function(e){ var r = e.reason; ghi('promise: ' + ((r && r.message) || String(r)), (r && r.stack || '').split(String.fromCharCode(10))[1] || ''); });
})();
</script>

<script>
(function(){
  var en = document.documentElement.getAttribute('data-lang') !== 'vi';
  var q = new URLSearchParams(location.search), WEB = (q.get('f') || '').replace(/[^\w-]/g, '');
  // 19/10: tài liệu 114 câu thành 118 câu, đổi tên link — link cũ ?f=114-cau-dai-pho (bài đăng, máy người đã lưu) vẫn mở, thanh địa chỉ đổi sang tên mới
  var DOI = {'114-cau-dai-pho': '118-cau-dai-pho'};
  if (DOI[WEB]) { WEB = DOI[WEB]; q.set('f', WEB); try { history.replaceState(null, '', '?' + q.toString() + location.hash); } catch(e){} }
  var f = (window.FILES || []).filter(function(x){ return x && x.web === WEB; })[0];
  var vung = document.getElementById('vung'), book = document.getElementById('book');
  function chu(v){ return !v ? '' : (typeof v === 'string' ? v : (en ? (v.en || v.vi) : (v.vi || v.en))); }
  function ga(ev, o){ try { if (window.gtag) gtag('event', ev, o || {}); } catch(e){} }
  function trongApp(){ return /; wv\)|FBAN|FBAV|FB_IAB|Instagram|Zalo|BytedanceWebview|musical_ly|TTWebView|Line\//i.test(navigator.userAgent || ''); }
  function baoLoi(h, p){ vung.innerHTML = '<div class="loi"><h2>' + h + '</h2><p>' + p + '</p></div>'; }

  if (!f){
    baoLoi(en ? 'File not found' : 'Không tìm thấy tài liệu',
      '<a href="/tai-lieu.html">' + (en ? 'Open the library &rarr;' : 'Mở kho tài liệu &rarr;') + '</a>');
    document.getElementById('tai').hidden = true;
    return;
  }
  var TEN = chu(f.name), TRACK = typeof f.name === 'string' ? f.name : (f.name.vi || f.name.en || WEB);
  var PDF = '/files/' + WEB + '.pdf';
  document.title = TEN + ' — hieunguyen.net';
  document.getElementById('ten').textContent = TEN;
  var tai = document.getElementById('tai');
  // 16/10: 46/54 người mở trang đọc là bấm tải ngay, mà phần lớn đến từ app Facebook — trong app, kiểu "tải về"
  // hay bấm không ăn (Clarity: bấm tải mà không nhận được file). Trong app: Android mở thẳng bằng Chrome,
  // iPhone mở file PDF ngay trong app (bỏ kiểu tải về) rồi lưu bằng nút chia sẻ.
  var APP = trongApp(), ANDROID = /Android/i.test(navigator.userAgent || '');
  function ganTai(a, viTri){
    a.href = PDF;
    if (APP) a.removeAttribute('download'); else a.setAttribute('download', WEB + '.pdf');
    var nhan = a.innerHTML;
    a.addEventListener('click', function(e){
      ga('file_download', { file_name: TRACK, form_location: viTri + (APP ? (ANDROID ? '_app_android' : '_app_ios') : '') });
      // 16/10: bấm tải xong trang đứng im -> khách tưởng chưa ăn, bấm lại (Clarity: 7 cú bấm hụt ở nút này / 3 ngày)
      a.innerHTML = en ? '✓ Downloading…' : '✓ Đang tải…';
      setTimeout(function(){ a.innerHTML = nhan; }, 4000);
      if (APP && ANDROID){
        e.preventDefault();
        location.href = 'intent://' + location.host + PDF + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
          encodeURIComponent(location.origin + PDF) + ';end';
      }
    });
  }
  ganTai(tai, 'doc');
  var goiY = document.getElementById('goiY');
  goiY.textContent = en ? 'Swipe or use the arrows to turn the page. Small text? Tap 🔍.' : 'Vuốt ngang hoặc bấm mũi tên để lật trang. Chữ nhỏ thì bấm 🔍.';
  if (APP){
    var bao = document.getElementById('bao');
    bao.textContent = ANDROID
      ? (en ? 'Tap DOWNLOAD PDF to open it in Chrome. Not working? Tap ⋮ at the top and choose “Open in browser”.'
            : 'Bấm DOWNLOAD PDF để mở file bằng Chrome. Không được thì bấm ⋮ ở góc trên, chọn “Mở bằng trình duyệt”.')
      : (en ? 'Tap DOWNLOAD PDF to open the file, then the share button to save it. Or tap ⋯ and choose “Open in browser”.'
            : 'Bấm DOWNLOAD PDF để mở file, rồi bấm nút chia sẻ để lưu lại. Hoặc bấm ⋯, chọn “Mở bằng trình duyệt”.');
    bao.hidden = false;
  }
  ga('file_preview', { file_name: TRACK, form_location: 'doc' });

  if (!window.pdfjsLib){ baoLoi(en ? 'Could not load the reader' : 'Không tải được trình đọc', '<a href="' + PDF + '">' + (en ? 'Open the PDF &rarr;' : 'Mở file PDF &rarr;') + '</a>'); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  pdfjsLib.getDocument(PDF).promise.then(function(pdf){
    var N = pdf.numPages;
    return pdf.getPage(1).then(function(p1){
      var vp = p1.getViewport({ scale: 1 });
      if (N === 1) return motTrang(p1, vp);
      return lat(pdf, N, vp);
    });
  }).catch(function(){
    baoLoi(en ? 'Could not open the file' : 'Không mở được tài liệu', '<a href="' + PDF + '">' + (en ? 'Open the PDF &rarr;' : 'Mở file PDF &rarr;') + '</a>');
  });

  // vẽ 1 trang PDF thành ảnh rộng `rong` px
  function veTrang(page, rong){
    var vp0 = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: rong / vp0.width });
    var c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    // intent 'print': PDF.js vẽ không chờ requestAnimationFrame -> tab nền / trình duyệt ẩn vẫn vẽ tiếp
    // 16/10: vẽ xong là TRẢ bộ nhớ canvas (c.width = 0) + page.cleanup(). Trước đây 32 trang × ~7–14 MB canvas nằm lại
    // chờ dọn -> Safari iPhone chạm trần bộ nhớ canvas, vẽ hỏng ("Script error." 4–14 giây sau khi mở, Clarity 15/10).
    return page.render({ canvasContext: c.getContext('2d'), viewport: vp, intent: 'print' }).promise.then(function(){
      return new Promise(function(ok, hong){ c.toBlob(function(b){
        c.width = c.height = 0; try { page.cleanup(); } catch(x){}
        if (b) ok(URL.createObjectURL(b)); else hong(new Error('toBlob rong'));
      }, 'image/jpeg', 0.88); });
    });
  }

  // ---- 1 trang khổ lớn: ảnh to, kéo xem, chụm 2 ngón để phóng ----
  function motTrang(page, vp){
    goiY.textContent = en ? 'Pinch or scroll to zoom and move around the drawing.' : 'Chụm 2 ngón hoặc cuộn để phóng to, kéo để xem từng chỗ.';
    var rong = Math.min(4000, Math.max(2400, vp.width * 2));
    return veTrang(page, rong).then(function(url){
      vung.innerHTML = '<div class="to"><img alt="' + TEN.replace(/"/g, '&quot;') + '"></div>';
      var img = vung.querySelector('img'); img.src = url;
      var to = 1; img.addEventListener('dblclick', function(){ to = to >= 3 ? 1 : to + 1; img.style.width = (to * 100) + '%'; });
      ga('doc_het', { file_name: TRACK });
    });
  }

  // ---- nhiều trang: lật sách ----
  function lat(pdf, N, vp){
    var tile = vp.height / vp.width;
    var html = '';
    for (var i = 1; i <= N; i++) html += '<div class="page cho" data-i="' + i + '"><img alt=""></div>';
    // trang cuối: CHƯA trỏ về app Mở Miệng (anh dặn 13/10: app chưa xong) -> chỉ Tải PDF + theo dõi kênh
    html += '<div class="page cuoi"><div class="cuoi-in">' +
      '<h2>' + (en ? 'Thanks for reading to the end.' : 'Cảm ơn bạn đã đọc tới trang cuối.') + '</h2>' +
      '<p>' + (en ? 'Save the PDF so you have it on board, and pass it to a shipmate who needs it.' : 'Tải PDF về để mang lên tàu, và gửi cho anh em đang cần.') + '</p>' +
      '<a class="nut" id="taiCuoi" href="' + PDF + '">' + (en ? 'Download the PDF' : 'Tải PDF') + '</a>' +
      '<p style="margin-top:18px">' + (en ? 'More every week on' : 'Bài mới mỗi tuần ở') +
      ' <a href="https://www.tiktok.com/@hieuatsea">TikTok</a> · <a href="https://www.facebook.com/hieuatsea">Facebook</a> · <a href="https://www.youtube.com/@hieuatsea">YouTube</a> — @hieuatsea</p>' +
      '</div></div>';
    book.innerHTML = html;
    // trang 1 mượn ảnh bìa trong lúc chờ vẽ; lớp bìa phủ chỉ gỡ khi trang 1 đã có hình (bìa hoặc bản vẽ thật)
    var bia1 = document.querySelector('#bia img'), p1 = book.querySelector('.page[data-i="1"]');
    function goBia(){ var l = document.getElementById('bia'); if (l) l.remove(); }
    function dungBia(){ if (p1.classList.contains('cho')){ p1.querySelector('img').src = bia1.src; p1.classList.remove('cho'); } goBia(); }
    if (bia1){ if (bia1.complete && bia1.naturalWidth) dungBia(); else { bia1.addEventListener('load', dungBia); bia1.addEventListener('error', goBia); } }
    else goBia();

    var pf = new St.PageFlip(book, {
      width: 600, height: Math.round(600 * tile), size: 'stretch',
      minWidth: 260, maxWidth: 1100, minHeight: Math.round(260 * tile), maxHeight: Math.round(1100 * tile),
      showCover: false, usePortrait: true, mobileScrollSupport: false, maxShadowOpacity: 0.35, flippingTime: 600
    });
    pf.loadFromHTML(book.querySelectorAll('.page'));

    var dem = document.getElementById('dem'), truoc = document.getElementById('truoc'), sau = document.getElementById('sau');
    document.getElementById('dieu').hidden = false;
    var tong = N + 1, daXem = {}, het = false;
    function capNhat(i){
      dem.textContent = Math.min(i + 1, N) + ' / ' + N;
      truoc.disabled = i <= 0; sau.disabled = i >= tong - 1;
      var trang = Math.min(i + 1, N);
      if (!daXem[trang]){ daXem[trang] = 1; if (trang > 1) ga('doc_trang', { file_name: TRACK, phan_tram: Math.round(trang / N * 100) }); }
      if (!het && i >= N - 1){ het = true; ga('doc_het', { file_name: TRACK }); }
      uuTien(i);
    }
    truoc.addEventListener('click', function(){ pf.flipPrev(); });
    sau.addEventListener('click', function(){ pf.flipNext(); });
    document.addEventListener('keydown', function(e){ if (e.key === 'ArrowLeft') pf.flipPrev(); if (e.key === 'ArrowRight') pf.flipNext(); });
    pf.on('flip', function(e){ capNhat(e.data); });
    // 🔍 phóng to trang đang mở: ảnh rộng gấp đôi màn hình, kéo để đọc, chạm "Đóng" để quay lại sách
    document.getElementById('phongTo').addEventListener('click', function(){
      var i = Math.min(pf.getCurrentPageIndex() + 1, N), el = document.querySelector('.page[data-i="' + i + '"] img');
      if (!el || !el.src) return;
      var o = document.createElement('div'); o.className = 'phong';
      o.innerHTML = '<button type="button" class="dong">' + (en ? 'Close' : 'Đóng') + ' &times;</button><img alt="">';
      o.querySelector('img').src = el.src;
      o.querySelector('.dong').addEventListener('click', function(){ o.remove(); });
      document.body.appendChild(o);
      ga('doc_phong', { file_name: TRACK });
    });
    ganTai(document.getElementById('taiCuoi'), 'doc_cuoi');

    // vẽ trang: ưu tiên quanh trang đang mở, còn lại vẽ dần ở nền
    // ảnh trang đủ nét để phóng 2 lần trên điện thoại (nút 🔍)
    var rong = Math.min(1600, Math.max(1100, Math.round(book.clientWidth * Math.min(2, window.devicePixelRatio || 1))));
    var xong = {}, dangVe = false, hang = [];
    function uuTien(i){ for (var k = i - 1; k <= i + 4; k++) if (k >= 0 && k < N && !xong[k + 1]) hang.unshift(k + 1); chay(); }
    function chay(){
      if (dangVe) return;
      var so = hang.shift();
      while (so && xong[so]) so = hang.shift();
      if (!so){ for (var t = 1; t <= N; t++) if (!xong[t]){ so = t; break; } }
      if (!so) return;
      dangVe = true; xong[so] = 1;
      pdf.getPage(so).then(function(pg){ return veTrang(pg, rong); }).then(function(url){
        var el = book.querySelector('.page[data-i="' + so + '"]');
        if (!el){ el = document.querySelector('.page[data-i="' + so + '"]'); }
        if (el){ el.querySelector('img').src = url; el.classList.remove('cho'); }
        if (so === 1) goBia();
        dangVe = false; setTimeout(chay, 0);
      }).catch(function(){ dangVe = false; setTimeout(chay, 0); });
    }
    capNhat(0);
  }
})();
</script>
</body>
</html>

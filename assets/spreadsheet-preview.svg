<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <!-- Ảnh minh hoạ spreadsheet Seafarer Financial Freedom Map — số liệu THẬT từ file xlsx (base case 10%) -->
  <defs>
    <linearGradient id="goldfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4a95a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d4a95a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="#0d1b30"/>

  <!-- thanh tiêu đề cửa sổ -->
  <rect width="640" height="36" fill="#152741"/>
  <circle cx="20" cy="18" r="5.5" fill="#e57373"/>
  <circle cx="40" cy="18" r="5.5" fill="#e5c073"/>
  <circle cx="60" cy="18" r="5.5" fill="#7bc98a"/>
  <text x="78" y="23" font-size="12.5" fill="#9fb0c4">Seafarer-Financial-Freedom-Map.xlsx</text>

  <!-- bảng trái: các chặng nghề -->
  <g font-size="11.5">
    <rect x="16" y="52" width="252" height="26" fill="#d4a95a" opacity="0.18"/>
    <text x="24" y="69" fill="#e8c88a" font-weight="700">Age</text>
    <text x="66" y="69" fill="#e8c88a" font-weight="700">Rank</text>
    <text x="196" y="69" fill="#e8c88a" font-weight="700">Save/mo</text>

    <rect x="16" y="78" width="252" height="26" fill="#ffffff" opacity="0.025"/>
    <text x="24" y="95" fill="#dfe7f2">23.5</text>
    <text x="66" y="95" fill="#dfe7f2">Third Officer</text>
    <text x="196" y="95" fill="#dfe7f2">$1,200</text>

    <text x="24" y="121" fill="#dfe7f2">25.5</text>
    <text x="66" y="121" fill="#dfe7f2">Second Officer</text>
    <text x="196" y="121" fill="#dfe7f2">$1,533</text>

    <rect x="16" y="130" width="252" height="26" fill="#ffffff" opacity="0.025"/>
    <text x="24" y="147" fill="#dfe7f2">27.0</text>
    <text x="66" y="147" fill="#dfe7f2">School (no pay)</text>
    <text x="196" y="147" fill="#e08c8c">−$800</text>

    <text x="24" y="173" fill="#dfe7f2">28.5</text>
    <text x="66" y="173" fill="#dfe7f2">Chief Officer</text>
    <text x="196" y="173" fill="#dfe7f2">$2,650</text>

    <rect x="16" y="182" width="252" height="26" fill="#ffffff" opacity="0.025"/>
    <text x="24" y="199" fill="#dfe7f2">31.5</text>
    <text x="66" y="199" fill="#dfe7f2">Captain</text>
    <text x="196" y="199" fill="#dfe7f2">$3,983</text>

    <rect x="16" y="208" width="252" height="28" fill="#d4a95a" opacity="0.28"/>
    <text x="24" y="226" fill="#e8c88a" font-weight="700">35.0</text>
    <text x="66" y="226" fill="#e8c88a" font-weight="700">FREEDOM</text>
    <text x="196" y="226" fill="#e8c88a" font-weight="700">$518,573</text>

    <!-- kẻ cột mảnh -->
    <line x1="60" y1="52" x2="60" y2="236" stroke="#9fb0c4" stroke-opacity="0.14"/>
    <line x1="190" y1="52" x2="190" y2="236" stroke="#9fb0c4" stroke-opacity="0.14"/>
    <rect x="16" y="52" width="252" height="184" fill="none" stroke="#9fb0c4" stroke-opacity="0.18"/>
  </g>

  <!-- biểu đồ phải: số dư tích luỹ 23.5 → 35 -->
  <g>
    <line x1="300" y1="200" x2="615" y2="200" stroke="#9fb0c4" stroke-opacity="0.07"/>
    <line x1="300" y1="150" x2="615" y2="150" stroke="#9fb0c4" stroke-opacity="0.07"/>
    <line x1="300" y1="100" x2="615" y2="100" stroke="#9fb0c4" stroke-opacity="0.07"/>
    <line x1="300" y1="250" x2="615" y2="250" stroke="#9fb0c4" stroke-opacity="0.28"/>

    <path d="M300,250 L352,239 L392,228 L431,220 L510,173 L602,76 L602,250 Z" fill="url(#goldfill)"/>
    <path d="M300,250 L352,239 L392,228 L431,220 L510,173 L602,76" fill="none" stroke="#e8c88a" stroke-width="2.5" stroke-linejoin="round"/>

    <circle cx="352" cy="239" r="3" fill="#d4a95a"/>
    <circle cx="392" cy="228" r="3" fill="#d4a95a"/>
    <circle cx="431" cy="220" r="3" fill="#d4a95a"/>
    <circle cx="510" cy="173" r="3" fill="#d4a95a"/>
    <circle cx="602" cy="76" r="5.5" fill="#d4a95a" stroke="#e8edf4" stroke-width="1.5"/>

    <text x="431" y="209" font-size="10.5" fill="#9fb0c4" text-anchor="middle">$90k</text>
    <text x="510" y="162" font-size="10.5" fill="#9fb0c4" text-anchor="middle">$230k</text>

    <text x="590" y="56" font-size="13" fill="#e8c88a" font-weight="700" text-anchor="end" letter-spacing="1.5">FREEDOM AT 35</text>
    <text x="590" y="80" font-size="21" fill="#ffffff" font-weight="800" text-anchor="end">$518,573</text>

    <text x="300" y="268" font-size="10.5" fill="#9fb0c4">Age 23.5</text>
    <text x="602" y="268" font-size="11" fill="#e8c88a" font-weight="700" text-anchor="middle">35</text>
  </g>

  <!-- thanh tab sheet dưới đáy -->
  <rect x="0" y="286" width="640" height="34" fill="#0a1628"/>
  <text x="24" y="307" font-size="11" fill="#9fb0c4">READ ME</text>
  <text x="100" y="307" font-size="11" fill="#9fb0c4">INPUTS</text>
  <text x="164" y="307" font-size="11" fill="#9fb0c4">MODEL</text>
  <rect x="222" y="292" width="76" height="22" rx="4" fill="#d4a95a" opacity="0.22"/>
  <text x="234" y="307" font-size="11" fill="#e8c88a" font-weight="700">SUMMARY</text>
</svg>
